name: Build and Test on Android 5.0

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Patch project
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, glob

          w = pathlib.Path("gradle/wrapper/gradle-wrapper.properties")
          s = w.read_text()
          s = re.sub(r'gradle-[\d.]+-bin\.zip', 'gradle-7.6.4-bin.zip', s)
          s = re.sub(r'^distributionSha256Sum=.*\n', '', s, flags=re.M)
          w.write_text(s)

          l = pathlib.Path("gradle/libs.versions.toml")
          s = l.read_text()
          for key, val in {
              "agp": "7.4.2", "kotlin": "1.9.24", "coreKtx": "1.9.0",
              "activity": "1.6.1", "lifecycleRuntimeKtx": "2.5.1",
              "appcompat": "1.5.1", "desugarJdkLibs": "2.0.4",
              "bouncycastle": "1.77",
          }.items():
              s = re.sub(rf'^{key} = ".*"', f'{key} = "{val}"', s, flags=re.M)
          l.write_text(s)

          for p in glob.glob("**/build.gradle*", recursive=True):
              if "/build/" in p or "/.gradle/" in p or p.startswith("build/"):
                  continue
              f = pathlib.Path(p)
              s = f.read_text()
              orig = s
              s = re.sub(r'compileSdk\s*\{\s*version\s*=\s*release\(\d+\)\s*\}', 'compileSdk = 34', s)
              s = re.sub(r'\bcompileSdk\s*=\s*\d+', 'compileSdk = 34', s)
              s = re.sub(r'\btargetSdk\s*=\s*\d+', 'targetSdk = 34', s)
              s = re.sub(r'\bminSdk\s*=\s*\d+', 'minSdk = 21', s)
              s = re.sub(r'\bminSdkVersion\s+\d+', 'minSdkVersion 21', s)
              s = re.sub(r'optimization\s*\{[^}]*\}', '', s)
              s = re.sub(r'^import com\.android\.build\.gradle\.internal\.tasks\.L8DexDesugarLibTask\s*$', '', s, flags=re.M)
              s = re.sub(r'afterEvaluate\s*\{[^{}]*?L8DexDesugarLibTask.*?\n\}\n', '', s, flags=re.S)
              s = s.replace("source.assets.directories", "source.assets.srcDirs")
              s = re.sub(r'\s*multiDexKeepProguard\s*=\s*file\([^)]*\)', '', s)
              s = re.sub(r'\s*multiDexKeepFile\s*=\s*file\([^)]*\)', '', s)
              if s != orig:
                  f.write_text(s)

          st = pathlib.Path("settings.gradle.kts")
          s = st.read_text()
          s = re.sub(r'plugins\s*\{\s*id\("org\.gradle\.toolchains\.foojay-resolver-convention"\)[^}]*\}\s*', '', s)
          st.write_text(s)

          # 删掉所有模块 manifest 里的 provider 声明
          for p in glob.glob("**/AndroidManifest.xml", recursive=True):
              if "/build/" in p or "/.gradle/" in p:
                  continue
              f = pathlib.Path(p)
              s = f.read_text()
              orig = s
              # 删掉整段 provider
              s = re.sub(r'<provider\s+[^>]*ApkUpdateProvider[^>]*/>', '', s)
              s = re.sub(r'<provider\s+[^>]*ApkUpdateProvider[^>]*>.*?</provider>', '', s, flags=re.S)
              # 删掉 Application 的 android:name
              s = s.replace('android:name="com.shilapi.xcertplay.DiPlayApplication"', '')
              s = s.replace('android:name="androidx.multidex.MultiDexApplication"', '')
              if s != orig:
                  f.write_text(s)
                  print(f"Patched manifest: {p}")

          # 用 tools:node="remove" 强制移除（不管在哪个模块声明）
          m = pathlib.Path("mobile/src/main/AndroidManifest.xml")
          s = m.read_text()
          s = re.sub(r'\s*android:dataExtractionRules="[^"]*"', '', s)
          s = re.sub(r'\s*android:localeConfig="[^"]*"', '', s)
          s = re.sub(r'\s*android:resizeableActivity="[^"]*"', '', s)
          if "tools:overrideLibrary" not in s:
              override = ('<uses-sdk tools:overrideLibrary="'
                  'androidx.media3.ui,androidx.media3.exoplayer,'
                  'androidx.media3.exoplayer.hls,androidx.media3.common,'
                  'androidx.media3.extractor,androidx.media3.container,'
                  'androidx.media3.datasource,androidx.media3.decoder,'
                  'androidx.media3.database,androidx.media,'
                  'androidx.core,androidx.appcompat,androidx.activity,'
                  'androidx.lifecycle.runtime,androidx.annotation,'
                  'androidx.multidex,androidx.recyclerview,androidx.fragment'
                  '" />')
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n    ' + override, s, count=1)
          # 在 <application ...> 后插入 remove 声明
          if 'tools:node="remove"' not in s:
              s = re.sub(
                  r'(<application[^>]*>)',
                  r'\1\n        <provider android:name="com.shilapi.xcertplay.ApkUpdateProvider" tools:node="remove" />\n        <provider android:name="androidx.core.content.FileProvider" tools:node="remove" />',
                  s,
                  count=1
              )
          m.write_text(s)
          print("Patched mobile manifest with tools:node=remove")

          gp = pathlib.Path("gradle.properties")
          s = gp.read_text() if gp.exists() else ""
          s = re.sub(r'^android\.enableJetifier=.*\n', '', s, flags=re.M)
          s = re.sub(r'^android\.suppressUnsupportedCompileSdk=.*\n', '', s, flags=re.M)
          if "android.useAndroidX" not in s:
              s += "\nandroid.useAndroidX=true\n"
          s += "android.suppressUnsupportedCompileSdk=34\n"
          gp.write_text(s)
          PYEOF

      - name: Show all manifests and patches
        run: |
          echo "========== 所有 AndroidManifest.xml 文件 =========="
          find . -name "AndroidManifest.xml" -not -path "*/build/*" -not -path "*/.gradle/*"
          echo ""
          echo "========== mobile manifest 内容 =========="
          cat mobile/src/main/AndroidManifest.xml
          echo ""
          echo "========== common manifest 内容 =========="
          cat common/src/main/AndroidManifest.xml 2>/dev/null || echo "(无)"
          echo ""
          echo "========== shared manifest 内容 =========="
          cat shared/src/main/AndroidManifest.xml 2>/dev/null || echo "(无)"
          echo ""
          echo "========== 检查 provider 是否还被声明 =========="
          grep -rn "ApkUpdateProvider" --include="AndroidManifest.xml" . | grep -v "/build/" || echo "无 provider 声明"

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :mobile:assembleDebug --stacktrace

      - name: 检查 APK 内的 dex 文件
        run: |
          APK=$(find mobile/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK: $APK"
          echo ""
          echo "========== APK 内所有 dex 文件 =========="
          unzip -l "$APK" | grep -E "\.dex" || echo "无 dex 文件"
          echo ""
          echo "========== APK 内 assets 里的 secondary dex =========="
          unzip -l "$APK" | grep -i "secondary" || echo "无 secondary dex"
          echo ""
          echo "========== 检查 ApkUpdateProvider 是否在 APK 里 =========="
          unzip -p "$APK" classes.dex 2>/dev/null | strings | grep -i "ApkUpdateProvider" | head -3 || echo "不在 classes.dex"
          unzip -p "$APK" classes2.dex 2>/dev/null | strings | grep -i "ApkUpdateProvider" | head -3 || echo "不在 classes2.dex"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-minSdk21-debug
          path: mobile/build/outputs/apk/debug/*.apk

      - name: Test on Android 5.0 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 21
          target: default
          arch: x86
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            echo "===== 设备信息 ====="
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            echo "===== 安装 APK ====="
            adb install -r mobile/build/outputs/apk/debug/*.apk || true
            adb logcat -c
            echo "===== 启动 App ====="
            adb shell monkey -p com.shihab.diplay.hudtest -c android.intent.category.LAUNCHER 1 || true
            sleep 60
            adb logcat -d > logcat-full.txt
            echo "===== FATAL EXCEPTION ====="
            grep -A 100 "FATAL EXCEPTION" logcat-full.txt || echo "没有崩溃"
            echo "===== 最后 100 行 ====="
            tail -100 logcat-full.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logs
          path: logcat-full.txt
