name: Build DiPlay Legacy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_PATH

      - name: Install SDK components
        run: |
          SDKMGR=$(find $ANDROID_SDK_ROOT -name sdkmanager -type f 2>/dev/null | head -n 1)
          yes | $SDKMGR --licenses > /dev/null 2>&1 || true
          $SDKMGR "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Patch project for AGP 7.4
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, glob

          # 1. Gradle wrapper: 9.5 -> 7.6.4
          w = pathlib.Path("gradle/wrapper/gradle-wrapper.properties")
          s = w.read_text()
          s = re.sub(r'gradle-[\d.]+-bin\.zip', 'gradle-7.6.4-bin.zip', s)
          s = re.sub(r'^distributionSha256Sum=.*\n', '', s, flags=re.M)
          w.write_text(s)
          print("patched gradle-wrapper.properties")

          # 2. libs.versions.toml
          l = pathlib.Path("gradle/libs.versions.toml")
          s = l.read_text()
          for key, val in {
              "agp": "7.4.2",
              "kotlin": "1.9.24",
              "coreKtx": "1.9.0",
              "activity": "1.6.1",
              "lifecycleRuntimeKtx": "2.5.1",
              "appcompat": "1.5.1",
              "desugarJdkLibs": "2.0.4",
          }.items():
              s = re.sub(rf'^{key} = ".*"', f'{key} = "{val}"', s, flags=re.M)
          l.write_text(s)
          print("patched libs.versions.toml")

          # 3. 全局扫描所有 build.gradle*
          for p in glob.glob("**/build.gradle*", recursive=True):
              if "/build/" in p or "/.gradle/" in p or p.startswith("build/"):
                  continue
              f = pathlib.Path(p)
              s = f.read_text()
              original = s
              s = re.sub(r'compileSdk\s*\{\s*version\s*=\s*release\(\d+\)\s*\}', 'compileSdk = 33', s)
              s = re.sub(r'\bcompileSdk\s*=\s*\d+', 'compileSdk = 33', s)
              s = re.sub(r'\btargetSdk\s*=\s*\d+', 'targetSdk = 33', s)
              s = re.sub(r'optimization\s*\{[^}]*\}', '', s)
              s = re.sub(r'^import com\.android\.build\.gradle\.internal\.tasks\.L8DexDesugarLibTask\s*$', '', s, flags=re.M)
              s = re.sub(
                  r'afterEvaluate\s*\{[^{}]*?L8DexDesugarLibTask.*?\n\}\n',
                  '',
                  s,
                  flags=re.S
              )
              s = s.replace("source.assets.directories", "source.assets.srcDirs")
              if s != original:
                  f.write_text(s)
                  print(f"patched {p}")

          # 4. settings.gradle.kts: 删除 foojay 插件
          st = pathlib.Path("settings.gradle.kts")
          s = st.read_text()
          s = re.sub(
              r'plugins\s*\{\s*id\("org\.gradle\.toolchains\.foojay-resolver-convention"\)[^}]*\}\s*',
              '',
              s
          )
          st.write_text(s)
          print("patched settings.gradle.kts")

          # 5. manifest: 删除 API 24+/31+/33+ 字段
          m2 = pathlib.Path("mobile/src/main/AndroidManifest.xml")
          if m2.exists():
              s = m2.read_text()
              s = re.sub(r'\s*android:dataExtractionRules="[^"]*"', '', s)
              s = re.sub(r'\s*android:localeConfig="[^"]*"', '', s)
              s = re.sub(r'\s*android:resizeableActivity="[^"]*"', '', s)
              m2.write_text(s)
              print("patched AndroidManifest.xml")

          # 6. gradle.properties: 开启 AndroidX
          gp = pathlib.Path("gradle.properties")
          s = gp.read_text() if gp.exists() else ""
          if "android.useAndroidX" not in s:
              s += "\nandroid.useAndroidX=true\n"
          if "android.enableJetifier" not in s:
              s += "android.enableJetifier=true\n"
          gp.write_text(s)
          print("patched gradle.properties")
          PYEOF

      - name: Verify patches
        run: |
          echo "===== gradle-wrapper ====="
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          echo "===== libs.versions ====="
          grep -E "^(agp|kotlin|coreKtx|activity|lifecycleRuntimeKtx|appcompat|desugarJdkLibs) " gradle/libs.versions.toml
          echo "===== 所有 build.gradle* 的 compileSdk/targetSdk ====="
          for f in $(find . -name "build.gradle*" -not -path "*/build/*" -not -path "*/.gradle/*"); do
            if grep -q "compileSdk\|targetSdk" "$f" 2>/dev/null; then
              echo "--- $f ---"
              grep -n "compileSdk\|targetSdk" "$f"
            fi
          done
          echo "===== mobile manifest 残留 ====="
          grep -n "dataExtractionRules\|localeConfig\|resizeableActivity" mobile/src/main/AndroidManifest.xml || echo "OK"
          echo "===== mobile assets API ====="
          grep -n "assets.directories\|assets.srcDirs" mobile/build.gradle.kts || true
          echo "===== gradle.properties AndroidX ====="
          grep -E "android.useAndroidX|android.enableJetifier" gradle.properties || true

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :mobile:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-debug
          path: mobile/build/outputs/apk/debug/*.apk
