name: Build for 4.2.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Patch build system
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, glob

          w = pathlib.Path("gradle/wrapper/gradle-wrapper.properties")
          s = w.read_text()
          s = re.sub(r'gradle-[\d.]+-bin\.zip', 'gradle-7.6.4-bin.zip', s)
          s = re.sub(r'^distributionSha256Sum=.*\n', '', s, flags=re.M)
          w.write_text(s)

          l = pathlib.Path("gradle/libs.versions.toml")
          s = l.read_text()
          for key, val in {
              "agp": "7.4.2", "kotlin": "1.9.24", "coreKtx": "1.9.0",
              "activity": "1.6.1", "lifecycleRuntimeKtx": "2.5.1",
              "appcompat": "1.5.1", "desugarJdkLibs": "2.0.4",
              "bouncycastle": "1.77",
          }.items():
              s = re.sub(rf'^{key} = ".*"', f'{key} = "{val}"', s, flags=re.M)
          l.write_text(s)

          for p in glob.glob("**/build.gradle*", recursive=True):
              if "/build/" in p or "/.gradle/" in p or p.startswith("build/"):
                  continue
              f = pathlib.Path(p)
              s = f.read_text()
              orig = s
              s = re.sub(r'compileSdk\s*\{\s*version\s*=\s*release\(\d+\)\s*\}', 'compileSdk = 34', s)
              s = re.sub(r'\bcompileSdk\s*=\s*\d+', 'compileSdk = 34', s)
              s = re.sub(r'\btargetSdk\s*=\s*\d+', 'targetSdk = 34', s)
              s = re.sub(r'\bminSdk\s*=\s*\d+', 'minSdk = 17', s)
              s = re.sub(r'\bminSdkVersion\s+\d+', 'minSdkVersion 17', s)
              s = re.sub(r'optimization\s*\{[^}]*\}', '', s)
              s = re.sub(r'^import com\.android\.build\.gradle\.internal\.tasks\.L8DexDesugarLibTask\s*$', '', s, flags=re.M)
              s = re.sub(r'afterEvaluate\s*\{[^{}]*?L8DexDesugarLibTask.*?\n\}\n', '', s, flags=re.S)
              s = s.replace("source.assets.directories", "source.assets.srcDirs")
              if s != orig:
                  f.write_text(s)

          st = pathlib.Path("settings.gradle.kts")
          s = st.read_text()
          s = re.sub(r'plugins\s*\{\s*id\("org\.gradle\.toolchains\.foojay-resolver-convention"\)[^}]*\}\s*', '', s)
          st.write_text(s)

          for p in glob.glob("**/AndroidManifest.xml", recursive=True):
              if "/build/" in p or "/.gradle/" in p:
                  continue
              f = pathlib.Path(p)
              s = f.read_text()
              orig = s
              s = re.sub(r'\s*android:dataExtractionRules="[^"]*"', '', s)
              s = re.sub(r'\s*android:localeConfig="[^"]*"', '', s)
              s = re.sub(r'\s*android:resizeableActivity="[^"]*"', '', s)
              s = s.replace('android:foregroundServiceType="connectedDevice|microphone|location"', '')
              if s != orig:
                  f.write_text(s)

          m = pathlib.Path("mobile/src/main/AndroidManifest.xml")
          s = m.read_text()
          if "tools:overrideLibrary" not in s:
              override = ('<uses-sdk tools:overrideLibrary="'
                  'androidx.media3.ui,androidx.media3.exoplayer,'
                  'androidx.media3.exoplayer.hls,androidx.media3.common,'
                  'androidx.media3.extractor,androidx.media3.container,'
                  'androidx.media3.datasource,androidx.media3.decoder,'
                  'androidx.media3.database,androidx.media,'
                  'androidx.core,androidx.appcompat,androidx.activity,'
                  'androidx.lifecycle.runtime,androidx.annotation,'
                  'androidx.multidex,androidx.recyclerview,androidx.fragment'
                  '" />')
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n    ' + override, s, count=1)
          m.write_text(s)

          gp = pathlib.Path("gradle.properties")
          s = gp.read_text() if gp.exists() else ""
          s = re.sub(r'^android\.enableJetifier=.*\n', '', s, flags=re.M)
          s = re.sub(r'^android\.suppressUnsupportedCompileSdk=.*\n', '', s, flags=re.M)
          if "android.useAndroidX" not in s:
              s += "\nandroid.useAndroidX=true\n"
          s += "android.suppressUnsupportedCompileSdk=34\n"
          gp.write_text(s)

          mk = pathlib.Path("mobile/build.gradle.kts")
          s = mk.read_text()
          if "multiDexKeepProguard" in s:
              s = re.sub(
                  r'multiDexKeepProguard\s*=\s*file\("multidex-config\.pro"\)',
                  '',
                  s
              )
          if "multiDexKeepFile" in s:
              s = re.sub(r'multiDexKeepFile\s*=\s*file\([^)]*\)\n?', '', s)
          mk.write_text(s)
          print("patched build system")
          PYEOF

      - name: Patch source for API 17
        run: |
          python3 - <<'PYEOF'
          import re, pathlib

          usb = pathlib.Path("shared/src/main/java/com/shilapi/xcertplay/transport/UsbApiCompat.kt")
          if usb.exists():
              s = usb.read_text()
              if "bulkTransferCompat" not in s:
                  func_lines = [
                      "internal fun bulkTransferCompat(",
                      "    connection: UsbDeviceConnection,",
                      "    endpoint: UsbEndpoint,",
                      "    buffer: ByteArray,",
                      "    offset: Int,",
                      "    count: Int,",
                      "    timeoutMillis: Int,",
                      "): Int = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.JELLY_BEAN_MR2) {",
                      "    connection.bulkTransfer(endpoint, buffer, offset, count, timeoutMillis)",
                      "} else {",
                      "    @Suppress(\"DEPRECATION\")",
                      "    connection.bulkTransfer(endpoint, buffer.copyOfRange(offset, offset + count), count, timeoutMillis)",
                      "}",
                      "",
                      "",
                  ]
                  func = "\n".join(func_lines)
                  s = s.replace("internal fun writeUsbChunks(", func + "internal fun writeUsbChunks(")
                  usb.write_text(s)

          iphone = pathlib.Path("shared/src/main/java/com/shilapi/xcertplay/transport/IphoneUsbHost.kt")
          if iphone.exists():
              s = iphone.read_text()
              s = s.replace(
                  "connection.bulkTransfer(outEndpoint, data, offset, count, timeout)",
                  "bulkTransferCompat(connection, outEndpoint, data, offset, count, timeout)"
              )
              iphone.write_text(s)

          crypto = pathlib.Path("shared/src/main/java/com/shilapi/xcertplay/airplay/AirPlayCrypto.kt")
          if crypto.exists():
              s = crypto.read_text()
              if "Build.VERSION.SDK_INT < 19" not in s:
                  old = "        val state = platformState.get() ?: return null"
                  new = ("        // API < 19: updateAAD unavailable, fall back to BouncyCastle\n"
                         "        if (Build.VERSION.SDK_INT < 19) return null\n"
                         "        val state = platformState.get() ?: return null")
                  s = s.replace(old, new, 1)
                  if "import android.os.Build" not in s:
                      s = s.replace("import java.nio.ByteBuffer", "import android.os.Build\nimport java.nio.ByteBuffer")
                  crypto.write_text(s)
          print("patched source")
          PYEOF

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :mobile:assembleDebug --stacktrace

      - name: Convert to legacy multidex layout
        run: |
          set -e
          APK=$(find mobile/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Original APK: $APK"
          
          # 解包
          rm -rf /tmp/apk_work
          mkdir -p /tmp/apk_work
          cd /tmp/apk_work
          unzip -q "$GITHUB_WORKSPACE/$APK"
          
          # 创建 legacy multidex 目录
          mkdir -p assets/secondary-program-dex-jars
          
          # 移动 classes2.dex, classes3.dex, classes4.dex 到 secondary-program-dex-jars
          for f in classes2.dex classes3.dex classes4.dex classes5.dex classes6.dex classes7.dex; do
            if [ -f "$f" ]; then
              # multiDex 期望的命名格式：<sha1>.dex.jar
              HASH=$(sha1sum "$f" | awk '{print $1}')
              mv "$f" "assets/secondary-program-dex-jars/$HASH.dex.jar"
              echo "Moved $f -> assets/secondary-program-dex-jars/$HASH.dex.jar"
            fi
          done
          
          # 重新打包（不压缩）
          zip -q -r -X "$GITHUB_WORKSPACE/mobile/build/outputs/apk/debug/mobile-debug-legacy.apk" . -x "META-INF/*"
          
          echo "=== 新的 APK 内容（dex 部分）==="
          unzip -l "$GITHUB_WORKSPACE/mobile/build/outputs/apk/debug/mobile-debug-legacy.apk" | grep -E "\.dex" || true
          echo "=== assets 部分 ==="
          unzip -l "$GITHUB_WORKSPACE/mobile/build/outputs/apk/debug/mobile-debug-legacy.apk" | grep "secondary-program" || true

      - name: Zipalign and sign
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          BT=$(find $ANDROID_SDK_ROOT/build-tools -name zipalign -type f | sort | tail -n 1)
          BT2=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner -type f | sort | tail -n 1)
          
          UNSIGNED="mobile/build/outputs/apk/debug/mobile-debug-legacy.apk"
          ALIGNED="mobile/build/outputs/apk/debug/mobile-debug-aligned.apk"
          FINAL="mobile/build/outputs/apk/debug/DiPlay-API17.apk"
          
          # 对齐
          $BT -v 4 "$UNSIGNED" "$ALIGNED"
          
          # 生成 debug keystore
          if [ ! -f /tmp/debug.keystore ]; then
            keytool -genkeypair -v -keystore /tmp/debug.keystore -alias debug \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
          fi
          
          # 用 v1 签名
          $BT2 sign \
            --ks /tmp/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias debug \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out "$FINAL" \
            "$ALIGNED"
          
          echo "=== 最终签名验证 ==="
          $BT2 verify --verbose "$FINAL" 2>&1 | head -10

      - name: Verify final APK
        run: |
          APK=$(find mobile/build/outputs/apk/debug -name "DiPlay-API17.apk" | head -n 1)
          echo "Final APK: $APK"
          BT=$(find $ANDROID_SDK_ROOT/build-tools -name aapt2 -type f | sort | tail -n 1)
          echo "=== sdkVersion ==="
          $BT dump badging "$APK" 2>&1 | grep -iE "sdkVersion"
          echo "=== 顶层 dex ==="
          unzip -l "$APK" | grep -E "^.*classes\.dex$" || true
          echo "=== assets/secondary-program-dex-jars ==="
          unzip -l "$APK" | grep "secondary-program"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-API17
          path: mobile/build/outputs/apk/debug/DiPlay-API17.apk
